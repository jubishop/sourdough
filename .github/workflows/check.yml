name: Repository checks

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The Ubuntu runner image includes ShellCheck; avoid unrelated apt repository failures.
      - name: Verify ShellCheck
        run: shellcheck --version
      # Without a version input, this installs the newest pnpm allowed by devEngines.packageManager.
      - uses: pnpm/action-setup@v6
      # setup-node's lts/* can lag nodejs.org when a new major turns LTS; see
      # docs/foundation/engineering-policy.md#runtime-and-toolchain-versions.
      - name: Find the newest Node LTS on nodejs.org
        id: node
        shell: bash
        run: |
          version=$(curl -fsSL --retry 3 https://nodejs.org/dist/index.json |
            jq -er '[.[] | select(.lts) | .version | ltrimstr("v")] | max_by(split(".") | map(tonumber))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository
        run: bin/check --full
